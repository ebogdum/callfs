server:
  listen_addr: ":8443"
  protocol: "https"
  cert_file: "/certs/node.pem"
  key_file: "/certs/node.key"
  external_url: "https://node3:8443"
  read_timeout: "30s"
  write_timeout: "30s"
  file_op_timeout: "30s"
  metadata_op_timeout: "10s"

auth:
  api_keys:
    - "test-api-key-integration-0123456"
  internal_proxy_secret: "test-internal-secret-0123456789"
  single_use_link_secret: "test-link-secret-01234567890123"

backend:
  default_backend: "localfs"
  localfs_root_path: "/data"
  internal_proxy_ca_file: "/certs/ca.pem"

metadata_store:
  type: "nats"

nats:
  enabled: true
  mode: "embedded"
  server_name: "node-3"
  cluster_name: "callfs-test"
  cluster_listen: "0.0.0.0:6222"
  routes_from_peers: false
  routes:
    - "nats-route://node1:6222"
    - "nats-route://node2:6222"
  jetstream:
    store_dir: "/nats-data"
  tls:
    cert_file: "/certs/node.pem"
    key_file: "/certs/node.key"
    ca_file: "/certs/ca.pem"

dlm:
  type: "nats"

instance_discovery:
  instance_id: "node-3"
  peer_endpoints:
    node-1: "https://node1:8443"
    node-2: "https://node2:8443"

erasure:
  enabled: true
  data_shards: 2
  parity_shards: 1
  min_file_size: 1024
  shard_backend: "localfs"
  shard_path: "/data/.erasure"

log:
  level: "debug"
  format: "json"
