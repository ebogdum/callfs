server:
  listen_addr: ":8443"
  protocol: "http"
  external_url: "http://node-s3:8443"

auth:
  api_keys:
    - "test-api-key-integration-0123456"
    - "test-api-key-secondary-9876543"
  internal_proxy_secret: "test-internal-secret-0123456789"
  single_use_link_secret: "test-link-secret-01234567890123"

backend:
  default_backend: "s3"
  localfs_root_path: "/data"
  s3_access_key: "minioadmin"
  s3_secret_key: "minioadmin123"
  s3_region: "us-east-1"
  s3_bucket_name: "callfs-test"
  s3_endpoint: "http://minio:9000"
  s3_server_side_encryption: ""
  s3_acl: ""

metadata_store:
  type: "sqlite"
  sqlite_path: "/data/callfs.sqlite3"

dlm:
  type: "local"

instance_discovery:
  instance_id: "node-s3"

log:
  level: "debug"
  format: "json"
