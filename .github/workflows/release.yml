name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries for all platforms
        run: |
          mkdir -p builds
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "darwin/amd64"
            "darwin/arm64"
            "freebsd/amd64"
            "freebsd/arm64"
            "openbsd/amd64"
            "openbsd/arm64"
          )
          for platform in "${PLATFORMS[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$platform"
            OUTPUT="builds/callfs-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              OUTPUT="${OUTPUT}.exe"
            fi
            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="-s -w" -o "$OUTPUT" ./cmd
          done
          ls -lh builds/

      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: release.sh also creates releases, so a tag pushed by that
          # script (or a re-run of this workflow) would otherwise fail here with
          # "a release with the same tag name already exists". Upload into the
          # existing release instead, keeping its curated changelog notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading binaries to it."
            gh release upload "${GITHUB_REF_NAME}" builds/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              builds/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

      - name: Trigger Go module proxy
        run: GOPROXY=https://proxy.golang.org go list -m github.com/ebogdum/callfs@${GITHUB_REF_NAME}
