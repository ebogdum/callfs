  - generic [ref=e195]:
    - generic [ref=e196]:
      - paragraph [ref=e197]: The insight and data you need
      - heading "Google Keyword Search Volume" [level=2] [ref=e198]
      - paragraph [ref=e199]:
        - text: The hidden search volume in Google Keyword Planner is back! We’ve built a new free bulk keyword search volume tool/checker.
        - text: Simply enter all your keywords in the field above and click “Submit.”
        - text: "Then the magic happens: In seconds, you’ll see the average monthly search volume for your selected keywords. The data can be exported to Excel. This is handy for people who work with online marketing and SEO."
        - strong [ref=e200]: About the Free Keyword Tool
        - text: You may know that Google now hides its search volume in Keyword Planner until you begin paying for Google Ads (former AdWords). Instead of showing exact numbers, Google now merely gives you ranges.
        - text: Since we’re guessing that Google will eventually limit the data to search volume ranges for all users of Keyword Planner, we’ve developed a method to measure search volumes using our own tools and data purchased from third-party providers.
        - text: Our goal is to provide keyword search volume for those without a Google Ads account and for a future in which we may not be able to rely on data from Google.
        - strong [ref=e201]: What is search volume?
        - text: Search volume is a measure of the total number of searches that are performed through search engines, expressed as the average monthly volume during the previous 12-month period.
        - emphasis [ref=e202]: Search volume data is a very important foundational element in your search engine optimization (SEO) strategy.
        - text: In order to target the most profitable keywords you need to know how many people out there (if anybody) are actually looking for a particular set of key search terms.
        - text: With the search volume finder
        - emphasis [ref=e203]: SearchVolume.io
        - text: you can do exactly that – estimate keyword traffic for free.
        - text: ‍
        - text: ‍
        - strong [ref=e204]: How to do keyword research?
        - text: Who doesn’t want to get more relevant traffic to one’s website?
        - text: ‍
        - text: But how do you find keywords for SEO that can give you that first-class traffic?
        - text: ‍
        - text: Well, first you need to identify the relevant search behavior of your target audience. In other words, you need to dig at little bit deeper to find out what people are actually searching for on Google and other search engines. How do you do that?
        - text: "Let us show you how you find the best keywords that will get you a lot of new visitors and customers. Follow these steps to perform real solid keyword research for your SEO strategy:"
        - strong [ref=e205]: Make a brainstorm.
        - text: Sit down with 1-2 of your colleagues and start brainstorming words related to your topic. Use search engines to find related keywords. Write down all the words you can think of.
        - text: ‍
        - strong [ref=e206]: Create a gross list with keywords.
        - text: Now choose the words from the brainstorm that make sense for your business to rank for. Write down the words on a list. This is your gross list, which you will need in the further research.
        - text: ‍
        - strong [ref=e207]: Check the competition.
        - text: Find out how many (and how good) the competing pages are in the search engine results for a given keyword. Many excellent pages will of course make it more difficult to rank. These keywords will take more of your time and therefore have to be worth it. Consider that before trying to rank for the high volume keywords.
        - text: ‍
        - strong [ref=e208]: Use the relevant keywords.
        - text: Now you have a well-informed understanding of the search behavior significant for your site. It’s now time to use the relevant keywords in your search engine optimization efforts. Maybe even use tools as
        - link "SEO.AI" [ref=e209] [cursor=pointer]:
          - /url: https://seo.ai/
        - text: to help you generate content or implement the keywords.
        - text: ‍
        - text: ‍
        - strong [ref=e210]: How do I find keyword search volume data?
        - text: Search engines like Google and Bing have their own tools that provide search volume numbers based on how many searches their users perform.
        - text: They are often tricky to use, and now Google has made it harder to obtain these search volume numbers.
        - text: While there are a few alternative keyword tools out there, none of them are free, fast, or easy to use. And they don't let you bulk thousands of keywords at a time when seeking search volume data.
        - text: That's what we do for you!
